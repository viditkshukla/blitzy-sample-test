version: '3.8'

# Docker Compose configuration for Node.js Hello World application local development
# Local source is bind-mounted into the container; hot reloading also requires a dev command, which no manifest defines

services:
  # Main application service
  hello-world-app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: hello-world-app:latest
    container_name: hello-world-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
    volumes:
      # Bind-mount local source into the container (hot reloading requires a dev command)
      - ../../src/backend:/app
      # Preserve node_modules in container
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/welcome"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: npm run dev
    networks:
      - hello-world-network

networks:
  hello-world-network:
    driver: bridge

volumes:
  node_modules:
    # Reserved named volume (currently unused): the service mounts /app/node_modules anonymously

# Usage instructions:
# - Start the container: docker-compose up
# - Start in detached mode: docker-compose up -d
# - View logs: docker-compose logs -f
# - Stop and remove the Compose containers and network: docker-compose down
# - Rebuild the container: docker-compose build