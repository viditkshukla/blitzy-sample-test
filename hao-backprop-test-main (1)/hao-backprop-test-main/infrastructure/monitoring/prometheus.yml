# Prometheus configuration file for Node.js Hello World application monitoring
# This defines metrics collection settings, scrape targets, and intervals

# Global configuration specifies parameters that are valid in all other configuration contexts
global:
  # How frequently to scrape targets by default
  scrape_interval: 15s
  # How frequently to evaluate rules
  evaluation_interval: 15s
  # How long until a scrape request times out
  scrape_timeout: 10s

# Scrape configurations contain the targets and parameters for metrics collection
scrape_configs:
  # Self-monitoring of the Prometheus server
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
    metrics_path: '/metrics'
    scheme: 'http'

  # Application metrics monitoring
  #
  # KNOWN GAP, PRE-EXISTING: the application exposes no /metrics endpoint. Its route table
  # registers exactly one route, /welcome, so this scrape receives 404 Not Found and
  # up{job="hello-world-app"} reads 0 against a service that is in fact healthy. Every
  # Grafana panel querying http_requests_total, http_request_duration_seconds_bucket,
  # nodejs_memory_usage_bytes, nodejs_cpu_usage_percentage, nodejs_event_loop_lag_seconds
  # or process_start_time_seconds therefore renders empty.
  #
  # This job is kept deliberately. It is the record of what grafana-dashboard.json queries,
  # and its job and service label values are what every PromQL selector in that dashboard
  # matches on, so deleting it or renaming a label would orphan the dashboard rather than
  # fix anything. Closing the gap needs instrumentation, an exporter or a /metrics endpoint,
  # which is out of scope here. See infrastructure/README.md, "Monitoring", for the full record.
  - job_name: 'hello-world-app'
    static_configs:
      - targets: ['hello-world-app:3000']
        labels:
          service: 'hello-world-app'
    metrics_path: '/metrics'
    scheme: 'http'
    # More frequent scraping for application metrics
    scrape_interval: 5s
    scrape_timeout: 3s

  # Application health monitoring
  #
  # KNOWN GAP, PRE-EXISTING: the application exposes no /health endpoint either, so this
  # scrape also receives 404 Not Found and up{job="hello-world-health"} reads 0. The
  # mechanism that does verify this service today is infrastructure/scripts/health-check.sh,
  # which requests /welcome and matches the response body; it is a deployment gate rather
  # than a scrape target, so it produces no series for this job. Kept for the same reason as
  # the job above: it records what the dashboard's "Health Check Status" panel queries.
  - job_name: 'hello-world-health'
    static_configs:
      - targets: ['hello-world-app:3000']
        labels:
          service: 'hello-world-app'
          endpoint: 'health'
    metrics_path: '/health'
    scheme: 'http'
    # Less frequent health checks
    scrape_interval: 30s
    scrape_timeout: 5s

# Alerting configuration (placeholder - not fully configured for this simple application)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # No alertmanager configured

# Rules files (placeholder - not used in this simple configuration)
rule_files: []