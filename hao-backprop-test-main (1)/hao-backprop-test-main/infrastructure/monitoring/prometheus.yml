# Prometheus configuration file for Node.js Hello World application monitoring
# This defines metrics collection settings, scrape targets, and intervals

# Global configuration specifies parameters that are valid in all other configuration contexts
global:
  # How frequently to scrape targets by default
  scrape_interval: 15s
  # How frequently to evaluate rules
  evaluation_interval: 15s
  # How long until a scrape request times out
  scrape_timeout: 10s

# Scrape configurations contain the targets and parameters for metrics collection
scrape_configs:
  # Self-monitoring of the Prometheus server
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
    metrics_path: '/metrics'
    scheme: 'http'

  # The application is deliberately not scraped. It serves a single HTTP route and exposes no
  # Prometheus exposition endpoint, so a scrape of it can only fail: every other path returns
  # a 404 text/plain body that carries no metric samples, which Prometheus records as a failed
  # scrape and reports as the service being permanently down whatever its real state.
  # Application availability is gated outside Prometheus instead: by
  # infrastructure/scripts/health-check.sh for deployments and by the container health check in
  # infrastructure/local/docker-compose.yml for a running container. An application scrape job
  # belongs here only alongside a real exposition endpoint served by the application under an
  # explicit metric-name and label contract.

# Alerting configuration (placeholder - not fully configured for this simple application)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # No alertmanager configured

# Rules files (placeholder - not used in this simple configuration)
rule_files: []